name: Check for updates
on:
  schedule:
  - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  flatpak-external-data-checker:
    if: github.repository == 'flathub/app.fluxer.Fluxer'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [ master ]

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ matrix.branch }}
      - name: Flatpak External Data Checker
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        with:
          args: --update --edit-only app.fluxer.Fluxer.yml
      - name: Source Generation
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3 jq
          ./generate-sources.sh
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer: Flatpak External Data Checker <41898282+github-actions[bot]@users.noreply.github.com>
          author: Flatpak External Data Checker <41898282+github-actions[bot]@users.noreply.github.com>
          base: master
          branch: update-master
          branch-suffix: short-commit-hash
          delete-branch: true
          commit-message: |
            update: fluxer and offline sources
          title: |
            update: fluxer and offline sources
          body: |
            This pull request was automatically generated by a [weekly scheduled workflow](https://github.com/flathub/app.fluxer.Fluxer/blob/master/.github/workflows/update-checker.yml).

            Runs [Flatpak External Data Checker](https://github.com/flathub-infra/flatpak-external-data-checker) with `--update --edit-only` to update source definitions in [`app.fluxer.Fluxer.yml`](https://github.com/flathub/app.fluxer.Fluxer/blob/master/app.fluxer.Fluxer.yml) and then regenerates source metadata using [`./generate-sources.sh`](https://github.com/flathub/app.fluxer.Fluxer/blob/master/generate-sources.sh) to ensure the manifest remains buildable.


