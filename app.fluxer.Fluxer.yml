id: app.fluxer.Fluxer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.llvm22
command: app.fluxer.Fluxer
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=pcsc
  - --share=network
  - --device=all
  - --filesystem=xdg-run/pipewire-0:ro
  - --filesystem=xdg-run/speech-dispatcher:ro
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --talk-name=org.ayatana.indicator.application
  - --talk-name=com.canonical.indicator.application
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
build-options:
  strip: true
  append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/llvm22/bin
  env:
    LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib
modules:
  - native-dependencies.yml
  - membarrier-shim.yml
  - name: fluxer
    buildsystem: simple
    cleanup:
      - /include
      - /lib/cmake
      - /lib/sdk
      - /lib/libcbor.a
      - /lib/pkgconfig
    build-options:
      strip: true
      prepend-path: /app/lib/sdk/rust/bin:/run/build/fluxer/pnpm/bin
      env:
        FLUXER_ELECTRON_DIST: /run/build/fluxer/fluxer-electron
        RUST_BACKTRACE: '1'
        BUILD_CHANNEL: stable
        LK_CUSTOM_WEBRTC: /run/build/fluxer/webrtc-linux
        CARGO_HOME: /run/build/fluxer/cargo
        CARGO_NET_OFFLINE: 'true'
        NPM_CONFIG_LOGLEVEL: info
        PNPM_CONFIG_TRUST_LOCKFILE: 'true'
        XDG_CACHE_HOME: /run/build/fluxer/flatpak-node/cache
        ELECTRON_SKIP_BINARY_DOWNLOAD: 'true'
        npm_config_nodedir: /usr/lib/sdk/node24
        npm_config_store_dir: /run/build/fluxer/flatpak-node/pnpm-store
        npm_config_offline: 'true'
    build-commands:
      - pnpm install --ignore-scripts --frozen-lockfile --offline --force
      - |
        set -eux
        . ./flatpak-node/electron-builder-arch-args.sh
        export VERSION="$(git describe --tags --exact-match --match 'fluxer-desktop-stable@*' | cut -d@ -f2)"
        export BUILD_VERSION="$VERSION" PUBLIC_BUILD_VERSION="$VERSION"
        export RELEASE_CHANNEL="$BUILD_CHANNEL" PUBLIC_RELEASE_CHANNEL="$BUILD_CHANNEL"
        unset CFLAGS CXXFLAGS
        cd fluxer_desktop
        if [ "$FLATPAK_ARCH" = aarch64 ]; then export LD_PRELOAD=/app/lib/membarrier-shim.so; fi
        pnpm build
        unset LD_PRELOAD
        pnpm exec electron-builder --dir --config electron-builder.config.cjs $ELECTRON_BUILDER_ARCH_ARGS
      - mv fluxer_desktop/dist-electron/linux*-unpacked $FLATPAK_DEST/fluxer
      # Inject the correct Flatpak App ID directly into the Electron archive:
      - patch-electron-desktop-filename ${FLATPAK_DEST}/fluxer/resources/app.asar
      - install -Dm755 ${FLATPAK_ID}.sh ${FLATPAK_DEST}/bin/${FLATPAK_ID}
      - install -Dm644 fluxer_desktop/packaging/linux/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 fluxer_desktop/packaging/linux/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 fluxer_desktop/packaging/linux/${FLATPAK_ID}.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
    sources:
      - type: git
        url: https://github.com/fluxerapp/fluxer.git
        disable-submodules: true
        tag: fluxer-desktop-stable@2026.1029.224039
        commit: b80ae44b7d629cc2770a0cf27d622e6e0563760d
        x-checker-data:
          type: git
          is-main-source: true
          tag-pattern: fluxer-desktop-stable@([\d.]+)$
      - type: file
        path: app.fluxer.Fluxer.sh
        # Patch the metadata file to inject the latest verison. Workaround until release tagging is set up upstream.
      - type: shell
        commands:
          - |
            set -eux
            VERSION="$(git describe --tags --exact-match --match 'fluxer-desktop-stable@*' | cut -d@ -f2)"
            ymd="${VERSION%.*}"
            y="${ymd%%.*}"
            md="${ymd#*.}"
            DATE="$(printf '%s-%02d-%02d' "$y" "$((md/100))" "$((md%100))")"
            metainf="fluxer_desktop/packaging/linux/${FLATPAK_ID}.metainfo.xml"
            sed -i -e '/<releases>/,/<\/releases>/d' -e '/<releases\/>/d' "$metainf"
            sed -i "s|</component>|    <releases>\n        <release version=\"$VERSION\" date=\"$DATE\"/>\n    </releases>\n</component>|" "$metainf"
      - pnpm.json
      - rust.json
      - wasm-bindgen.json
      - pnpm-sources.json
      - cargo-sources.json
      - cargo-linux-webrtc.json
      - fluxer-electron.json
